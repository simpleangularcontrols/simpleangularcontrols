<div>
    Item {{ name }} ({{ index }})
    <sac-contextmenu>
        <sac-contextmenubutton
            text="Action 1"
            *ngIf="index > 0"
            (clicked)="showdialog('Hallo 1')">
        </sac-contextmenubutton>
        <sac-contextmenubutton
            name="action2_{{ index }}"
            text="Action 2"
            (clicked)="showdialog('Hallo 2')">
        </sac-contextmenubutton>
        <sac-contextmenubutton
            text="Action 3"
            (clicked)="showdialog('Hallo 3')">
        </sac-contextmenubutton>
    </sac-contextmenu>
</div>
