<h2>Grid</h2>
<sac-grid
    name="gridDefault"
    [value]="dataDefault"
    placeholder="grid"
    label="imgrid"
    (paging)="pagingDefault($event)"
    [pagerdata]="pagerDefault">
    <ng-template
        let-row="row"
        let-type="type">
        <sac-gridcolumnaction
            name="editCol"
            [type]="type"
            width="105px">
            <sac-gridbutton
                name="editrow"
                icon="edit"
                (clicked)="action($event)"
                [isdisabled]="true"></sac-gridbutton>
            <sac-gridbutton
                name="deleterow"
                icon="delete"
                (clicked)="action($event)"></sac-gridbutton>
            <sac-gridbutton
                iconstyle="fa"
                icon="fa-info-circle"
                (clicked)="action('info')"></sac-gridbutton>
            <sac-gridbutton
                iconstyle="fa"
                icon="fa-info-circle"
                isdisabled="true"
                (clicked)="action('info')"></sac-gridbutton>
            <sac-gridimage iconstyle="fa fa-exclamation-triangle"></sac-gridimage>
        </sac-gridcolumnaction>
        <sac-gridcolumn
            name="someName44"
            [type]="type"
            header="ID"
            [value]="row.Id"
            (rowclicked)="action(row.Id)"></sac-gridcolumn>
        <sac-gridcolumn
            name="someName14"
            [type]="type"
            header="Bild"
            [value]="row.Image"
            width="25%"></sac-gridcolumn>
        <sac-gridcolumn
            name="someName35"
            [type]="type"
            header="Bezeichnung"
            [value]="row.Bezeichnung"
            width="25%"></sac-gridcolumn>
    </ng-template>
</sac-grid>
