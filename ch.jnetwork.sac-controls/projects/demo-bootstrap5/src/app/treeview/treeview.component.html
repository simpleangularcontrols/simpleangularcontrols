<h2>Treeview</h2>
<form
    #myForm="sacform"
    labelsize="3">
    <h3>Treeview with default options</h3>

    <sac-treeview [data]="data1"> </sac-treeview>

    <h3>Treeview with all actions visible</h3>

    <sac-treeview
        [data]="data1"
        [showactionalways]="true"
        attricon="icon"
        (selected)="onSelected($event)"
        (selectednode)="onSelectedNode($event)"
        (expanded)="onExpand($event)"
        (collabsed)="onCollabse($event)">
    </sac-treeview>

    <h3>Treeview without expanded state</h3>

    <sac-treeview
        [data]="data1"
        [expandedstate]="false"
        (actionclicked)="debugAction($event)"
        attricon="icon">
    </sac-treeview>

    <h3>Treeview with Custom Actions</h3>

    <sac-treeview
        [data]="data1"
        [expandedstate]="false"
        [templateaction]="templateaction"
        (actionclicked)="debugAction($event)"
        attricon="icon">
        <ng-template
            #templateaction
            let-node="node"
            let-actionhandler="actionhandler">
            <a
                class="btn btn-sm btn-link text-secondary"
                (click)="actionhandler({ action: 'edit', node: node })">
                <i class="fa fa-edit"></i>
            </a>
            <sac-contextmenu cssclass="d-inline-block">
                <sac-contextmenubutton
                    text="Ordner erstellen"
                    icon="fa fa-new"
                    (clicked)="actionhandler({ action: 'add', node: node })">
                </sac-contextmenubutton>
                <sac-contextmenubutton
                    text="Ordner löschen"
                    icon="fa fa-trash"
                    (clicked)="actionhandler({ action: 'delete', node: node })">
                </sac-contextmenubutton>
                <sac-contextmenusplitter></sac-contextmenusplitter>
                <sac-contextmenubutton
                    text="Aktualisieren"
                    icon="fa fa-refresh"
                    (clicked)="actionhandler({ action: 'refresh', node: node })">
                </sac-contextmenubutton>
            </sac-contextmenu>
        </ng-template>
    </sac-treeview>

    <h3>Treeview which loads nodes when expanding</h3>

    <sac-treeview
        [data]="data1"
        [enableasynchload]="true"
        attricon="icon"
        (expanded)="appendNode($event)">
    </sac-treeview>
</form>
