<div
    class="dropdown"
    [ngClass]="cssclass"
    [attr.data-e2e-key]="name | testingattribute: e2eidentifier">
    <ng-container [ngTemplateOutlet]="buttontemplate || defaultButtonTemplate"></ng-container>

    <ul
        class="dropdown-menu dropdown-menu-right"
        sacContextMenuContainer
        [class.show]="isopen">
        <ng-content></ng-content>
    </ul>
</div>

<ng-template #defaultButtonTemplate>
    <button
        sacContextMenuAnchor
        class="btn btn-link"
        type="button"
        (click)="toggle()">
        <i [class]="IconContextMenu"></i>
    </button>
</ng-template>
