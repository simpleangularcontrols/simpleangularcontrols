<div
    class="row form-group"
    [class.has-error]="invalid && (dirty || touched)"
    [ngClass]="componentHeight | toLabelHeight"
    [attr.data-e2e-key]="name | testingattribute : e2eidentifier">
    <label
        *ngIf="disablelabel === false"
        id="{{ name }}label"
        for="{{ name }}"
        class="col-xs-12 control-label"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'sr-only']"
        [class.required]="isrequired">
        <span class="text">{{ label }}</span>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [class]="HelptextTooltipIcon"
                style="margin-left: 5px">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-xs-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']"
        [style.display]="helptextmode === 'tooltip' && helptext && disablelabel ? 'flex' : null">
        <div
            style="position: relative"
            [style.width.px]="componentHeight === ControlHeight.Small ? 120 : componentHeight === ControlHeight.Large ? 180 : 140">
            <div
                class="datetime-textbox input-group"
                [class.input-group-sm]="componentHeight === ControlHeight.Small"
                [class.input-group-lg]="componentHeight === ControlHeight.Large">
                <!-- this class comes in the div above when disabled [ngClass]="[disablelabel === false ? 'col-md-' + _inputsize : 'col-md-12']" -->
                <input
                    id="{{ name }}"
                    name="{{ name }}"
                    type="text"
                    class="form-control date-control"
                    [class.is-invalid]="invalid && (dirty || touched)"
                    [ngClass]="[componentHeight | toControlHeight]"
                    [imask]="imaskDate"
                    [attr.placeholder]="placeholder"
                    [value]="valuestring"
                    (blur)="onTouch()"
                    (accept)="setValueString($event)"
                    [disabled]="isdisabled"
                    (click)="showDateSelector()" />
                <span class="input-group-btn">
                    <button
                        #pickerbutton
                        class="btn btn-default"
                        type="button"
                        (click)="showDateSelector()"
                        [disabled]="isdisabled">
                        <i [class]="IconSelector"></i>
                    </button>
                </span>
            </div>
            <p
                *ngIf="helptextmode === 'text' && helptext"
                class="help-block">
                {{ helptext }}
            </p>
            <div
                class="help-block help-block-error"
                *ngIf="isinlineerrorenabled && invalid && (dirty || touched)">
                {{ GetErrorMessage() | async }}
            </div>

            <div
                #picker
                *ngIf="_showselector">
                <div
                    class="popover in"
                    role="tooltip"
                    style="display: block; max-width: unset; margin: 0"
                    [class.bottom]="GetPickerPosition() == TooltipPosition.bottom || GetPickerPosition() == TooltipPosition.bottomend"
                    [class.top]="GetPickerPosition() == TooltipPosition.top || GetPickerPosition() == TooltipPosition.topend"
                    [style.left.px]="posPopupLeft"
                    [style.top.px]="posPopupTop">
                    <div
                        #pickerarrow
                        style="margin: 0"
                        class="arrow"
                        [style.top.px]="posArrowTop"
                        [style.left.px]="posArrowLeft">
                    </div>

                    <div class="popover-content">
                        <sac-dateselector
                            *ngIf="_showselector"
                            [initialvalue]="value"
                            (selectdate)="dateselect($event)"
                            dateselection="true">
                        </sac-dateselector>
                    </div>
                </div>
            </div>
        </div>

        <div
            *ngIf="helptextmode === 'tooltip' && helptext && disablelabel"
            class="form-control-static"
            style="margin-left: 5px">
            <sac-tooltip
                *ngIf="helptextmode === 'tooltip' && helptext"
                [tooltiptext]="helptext"
                [inlinemode]="true">
                <span
                    [class]="HelptextTooltipIcon"
                    style="margin-left: 5px; margin-right: 5px">
                </span>
            </sac-tooltip>
        </div>
    </div>
</div>
