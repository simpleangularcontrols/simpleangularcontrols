<th
    scope="col"
    *ngIf="IsHeader()"
    [style.width]="width"
    [class.text-right]="alignment === 'right'"
    [class.text-center]="alignment === 'center'">
    <span></span>
</th>
<td
    scope="col"
    *ngIf="IsBody()"
    [class.text-right]="alignment === 'right'"
    [class.text-center]="alignment === 'center'">
    <ng-content></ng-content>
</td>
