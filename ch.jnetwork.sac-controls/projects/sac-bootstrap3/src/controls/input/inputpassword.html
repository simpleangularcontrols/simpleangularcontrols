<div
    class="row form-group"
    [class.has-error]="invalid && (dirty || touched)"
    [ngClass]="componentHeight | toLabelHeight"
    [attr.data-e2e-key]="name | testingattribute : e2eidentifier">
    <label
        *ngIf="disablelabel === false && !isAdaptiveLabel"
        id="{{ name }}label"
        for="{{ name }}"
        class="col-xs-12 control-label"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'sr-only']"
        [class.required]="isrequired">
        <span class="text">{{ label }}</span>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [class]="HelptextTooltipIcon"
                style="margin-left: 5px">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-xs-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']">
        <div [style.display]="helptextmode === 'tooltip' && helptext && disablelabel ? 'flex' : null">
            <div [class.input-group]="passwordeye">
                <input
                    id="{{ name }}"
                    name="{{ name }}"
                    class="form-control"
                    [ngClass]="[componentHeight | toControlHeight]"
                    [class.is-invalid]="invalid && (dirty || touched)"
                    [type]="passwordeyevisible ? 'text' : 'password'"
                    [value]="value"
                    [attr.placeholder]="placeholder"
                    (blur)="onTouch()"
                    (input)="setValue($event.target.value)"
                    (keypress)="onKeyPress($event)"
                    [attr.maxlength]="maxtextlength"
                    autocomplete="new-password"
                    [disabled]="isdisabled"
                    [readonly]="readonly" />
                <div
                    *ngIf="passwordeye"
                    class="input-group-btn">
                    <a
                        class="btn btn-default"
                        (click)="onTogglePasswordEye()"
                        ><span [ngClass]="passwordeyevisible ? PasswordEyeVisibleIcon : PasswordEyeHiddenIcon"></span
                    ></a>
                </div>
            </div>
            <div
                *ngIf="helptextmode === 'tooltip' && helptext && disablelabel"
                class="form-control-static"
                style="margin-left: 5px">
                <sac-tooltip
                    *ngIf="helptextmode === 'tooltip' && helptext"
                    [tooltiptext]="helptext"
                    [inlinemode]="true">
                    <span
                        [class]="HelptextTooltipIcon"
                        style="margin-left: 5px; margin-right: 5px">
                    </span>
                </sac-tooltip>
            </div>
        </div>

        <p
            *ngIf="helptextmode === 'text' && helptext"
            class="help-block">
            {{ helptext }}
        </p>

        <div
            class="help-block help-block-error"
            *ngIf="isinlineerrorenabled && invalid && (dirty || touched)">
            {{ GetErrorMessage() | async }}
        </div>
    </div>
</div>
