<div
    class="row form-group"
    [class.has-error]="invalid && (dirty || touched)"
    [ngClass]="componentHeight | toLabelHeight"
    [attr.data-e2e-key]="name | testingattribute: e2eidentifier">
    <label
        *ngIf="disablelabel === false"
        id="{{ name }}label"
        for="{{ name }}"
        class="col-xs-12 control-label"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'sr-only']"
        [class.required]="isrequired">
        <span class="text">{{ label }}</span>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [class]="HelptextTooltipIcon"
                style="margin-left: 5px">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-xs-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']">
        <div [style.display]="helptextmode === 'tooltip' && helptext && disablelabel ? 'flex' : null">
            <select
                #dropdownitem
                id="{{ name }}"
                name="{{ name }}"
                class="form-control"
                [ngClass]="[componentHeight | toControlHeight]"
                [class.is-invalid]="invalid && (dirty || touched)"
                (blur)="onTouch()"
                (change)="setValue(dropdownitem.value)"
                [disabled]="isdisabled">
                <option
                    *ngIf="emptylabel !== ''"
                    [ngValue]="emptyvalue"
                    >{{ emptylabel }}</option
                >

                <ng-content></ng-content>

                <ng-container *ngIf="groupitems === ''">
                    <option
                        *ngFor="let item of options"
                        [ngValue]="optionvalue ? item[optionvalue] : item"
                        [disabled]="optionenabled !== '' && item[optionenabled] === false">
                        <ng-template *ngTemplateOutlet="optionlabeltemplate || defaultItemLabelTemplate; context: { label: item[optionlabel], item: item }"> </ng-template>
                    </option>
                </ng-container>

                <ng-container *ngIf="groupitems !== ''">
                    <optgroup
                        *ngFor="let group of options"
                        [attr.label]="group[grouplabel]">
                        <option
                            *ngFor="let item of group[groupitems]"
                            [ngValue]="optionvalue ? item[optionvalue] : item"
                            [disabled]="optionenabled !== '' && item[optionenabled] === false">
                            <ng-template *ngTemplateOutlet="optionlabeltemplate || defaultItemLabelTemplate; context: { label: item[optionlabel], item: item }"> </ng-template>
                        </option>
                    </optgroup>
                </ng-container>
            </select>

            <div
                *ngIf="helptextmode === 'tooltip' && helptext && disablelabel"
                class="form-control-static"
                style="margin-left: 5px">
                <sac-tooltip
                    *ngIf="helptextmode === 'tooltip' && helptext"
                    [tooltiptext]="helptext"
                    [inlinemode]="true">
                    <span
                        [class]="HelptextTooltipIcon"
                        style="margin-left: 5px; margin-right: 5px">
                    </span>
                </sac-tooltip>
            </div>
        </div>

        <p
            *ngIf="helptextmode === 'text' && helptext"
            class="help-block">
            {{ helptext }}
        </p>

        <div
            class="help-block help-block-error"
            *ngIf="isinlineerrorenabled && invalid && (dirty || touched)">
            {{ GetErrorMessage() | async }}
        </div>
    </div>
</div>

<ng-template
    #defaultItemLabelTemplate
    let-label="label"
    >{{ label }}</ng-template
>
