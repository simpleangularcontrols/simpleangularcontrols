<div
    class="row form-group"
    [class.has-error]="invalid && (dirty || touched)"
    [ngClass]="componentHeight | toLabelHeight"
    [attr.data-e2e-key]="name | testingattribute: e2eidentifier">
    <label
        for="{{ name }}"
        class="col-xs-12 control-label"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'sr-only']"
        [class.required]="isrequired">
        <span class="text">{{ label }}</span>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [class]="HelptextTooltipIcon"
                style="margin-left: 5px">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-xs-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']"
        [class.has-error]="isinlineerrorenabled && invalid && (dirty || touched)"
        [style.display]="helptextmode === 'tooltip' && helptext && disablelabel ? 'flex' : null">
        <div [style.flex-grow]="helptextmode === 'tooltip' && helptext && disablelabel ? 1 : null">
            <editor
                [id]="name + '_tinymce'"
                [init]="_config"
                [initialValue]="value"
                ngModel
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="setValue($event)"
                (onSaveContent)="save($event.event.content)"
                (onBlur)="blur()"
                [disabled]="disabled"
                [class.is-invalid]="isinlineerrorenabled && invalid && (dirty || touched)"></editor>
            <p
                *ngIf="helptextmode === 'text' && helptext"
                class="help-block">
                {{ helptext }}
            </p>
            <div
                *ngIf="isinlineerrorenabled && invalid && (dirty || touched)"
                class="help-block">
                {{ GetErrorMessage() | async }}
            </div>
        </div>

        <div
            *ngIf="helptextmode === 'tooltip' && helptext && disablelabel"
            class="form-control-static"
            style="margin-left: 5px">
            <sac-tooltip
                *ngIf="helptextmode === 'tooltip' && helptext"
                [tooltiptext]="helptext"
                [inlinemode]="true">
                <span
                    [class]="HelptextTooltipIcon"
                    style="margin-left: 5px; margin-right: 5px">
                </span>
            </sac-tooltip>
        </div>
    </div>
</div>

<sac-dialog
    *ngIf="selectdialogvisible()"
    [allowesc]="false"
    [backdrop]="true"
    [isvisible]="selectdialogvisible()"
    (isvisibleChange)="selectdialogvisible.set($event)"
    title="{{ lngResourceService.GetString(validationKeyService.TinyMceFileselectDialogtitle) | async }}"
    size="large"
    height="500px">
    <ng-container dialogbody> </ng-container>
    <ng-container dialogfooter>
        <sac-button
            role="primary"
            [name]="name + '_modalOk'"
            text="{{ lngResourceService.GetString(validationKeyService.TinyMceFileselectOk) | async }}"
            (clicked)="setSelectDialogResult()"></sac-button>
        <sac-button
            [name]="name + '_modalClose'"
            text="{{ lngResourceService.GetString(validationKeyService.TinyMceFileselectCancel) | async }}"
            (clicked)="closeSelectDialog()"></sac-button>
    </ng-container>
</sac-dialog>
