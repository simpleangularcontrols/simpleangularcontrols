<div
    id="{{ name }}"
    class="row form-group"
    [class.has-error]="invalid && (dirty || touched)"
    [ngClass]="componentHeight | toLabelHeight"
    [attr.data-e2e-key]="name | testingattribute: e2eidentifier">
    <label
        *ngIf="disablelabel === false"
        id="{{ name }}label"
        for="{{ name }}_uploadinput"
        class="col-xs-12 control-label"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'sr-only']"
        [class.required]="isrequired">
        <span class="text">{{ label }}</span>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [class]="HelptextTooltipIcon"
                style="margin-left: 5px">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-xs-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']"
        [style.display]="helptextmode === 'tooltip' && helptext && disablelabel ? 'flex' : null">
        <div [style.flex-grow]="helptextmode === 'tooltip' && helptext && disablelabel ? 1 : null">
            <div
                class="img-rounded dropzone control-label"
                (drop)="dropHandler($event)"
                (dragover)="onDragOver($event)"
                (dragleave)="onDragLeave($event)"
                [style.min-height]="uploadheight"
                [class.active]="active"
                [class.is-invalid]="invalid && (dirty || touched)">
                <div
                    class="content"
                    *ngIf="uploads.length === 0">
                    <div>
                        <div [class.is-invalid]="isinlineerrorenabled && invalid && (dirty || touched)">
                            <ng-content></ng-content>
                        </div>
                    </div>
                </div>
                <div *ngIf="uploads.length > 0">
                    <div>
                        <div
                            class="dropzone-uploadstates"
                            *ngFor="let file of uploads">
                            <div
                                class="input-group upload-component upload-component-multiple"
                                [class.input-group-sm]="componentHeight === ControlHeight.Small"
                                [class.input-group-lg]="componentHeight === ControlHeight.Large">
                                <div class="form-control upload-progress">
                                    <div class="progress">
                                        <div
                                            class="progress-bar"
                                            [class.progress-bar-success]="file.progress === 100"
                                            role="progressbar"
                                            [attr.aria-valuenow]="file.progress"
                                            aria-valuemin="0"
                                            aria-valuemax="100"
                                            [style.width.%]="file.progress">
                                            <span class="progress-text">{{ file.name }}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="input-group-btn">
                                    <!-- image-preview-clear button -->
                                    <a
                                        class="btn"
                                        (click)="cancel(file.uploadId)"
                                        [class.btn-default]="!(invalid && (dirty || touched))"
                                        [class.btn-danger]="invalid && (dirty || touched)">
                                        <span [class]="IconDelete"></span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <input
                    #files
                    id="{{ name }}_uploadinput"
                    type="file"
                    class="custom-file-input"
                    (click)="files.value = ''"
                    (uploadxState)="onUpload($event)"
                    [disabled]="HasQueueItem()" />
            </div>
            <small
                *ngIf="helptextmode === 'text' && helptext"
                class="help-block">
                {{ helptext }}
            </small>
            <div
                *ngIf="isinlineerrorenabled && invalid && (dirty || touched)"
                class="help-block help-block-error">
                {{ GetErrorMessage() | async }}
            </div>
        </div>

        <div
            *ngIf="helptextmode === 'tooltip' && helptext && disablelabel"
            class="form-control-static"
            style="margin-left: 5px">
            <sac-tooltip
                *ngIf="helptextmode === 'tooltip' && helptext"
                [tooltiptext]="helptext"
                [inlinemode]="true">
                <span
                    [class]="HelptextTooltipIcon"
                    style="margin-left: 5px; margin-right: 5px">
                </span>
            </sac-tooltip>
        </div>
    </div>
</div>
