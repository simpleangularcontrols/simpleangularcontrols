<div
    class="row form-group"
    [class.no-gutters]="disablelabel"
    [attr.data-e2e-key]="name | testingattribute : e2eidentifier">
    <label
        for="{{ name }}"
        class="col-12 col-form-label d-flex"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'sr-only', componentHeight | toLabelHeight]"
        [class.required]="isrequired">
        <div
            class="text flex-grow-0"
            [class.flex-sm-grow-1]="splitlabelandhelptext">
            {{ label }}
        </div>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true"
            ><span
                [ngClass]="HelptextTooltipIcon"
                class="ml-1">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']"
        [class.d-flex]="helptextmode === 'tooltip' && helptext && disablelabel">
        <div [class.flex-grow-1]="helptextmode === 'tooltip' && helptext && disablelabel">
            <div
                class="input-group"
                [class.input-group-sm]="componentHeight === ControlHeight.Small"
                [class.input-group-lg]="componentHeight === ControlHeight.Large"
                [class.has-validation]="isinlineerrorenabled && invalid && (dirty || touched)">
                <input
                    id="{{ name }}"
                    name="{{ name }}"
                    type="text"
                    class="form-control"
                    [imask]="imaskDate"
                    [attr.placeholder]="placeholder"
                    [value]="valuestring"
                    [class.is-invalid]="invalid && (dirty || touched)"
                    [ngClass]="[componentHeight | toControlHeight]"
                    (blur)="onTouch()"
                    (accept)="setValueString($event)"
                    [disabled]="isdisabled" />
                <div class="input-group-append">
                    <button
                        #pickerbutton
                        class="btn btn-secondary"
                        type="button"
                        (click)="showTimeSelector()"
                        [disabled]="isdisabled">
                        <i [class]="IconSelector"></i>
                    </button>
                </div>
                <div
                    *ngIf="isinlineerrorenabled && invalid && (dirty || touched)"
                    class="invalid-feedback">
                    {{ GetErrorMessage() | async }}
                </div>
            </div>
            <small
                *ngIf="helptextmode === 'text' && helptext"
                class="form-text text-muted">
                {{ helptext }}
            </small>
            <div
                #picker
                *ngIf="_showselector">
                <div
                    class="popover fade show position-absolute m-0"
                    role="tooltip"
                    [class.bs-popover-bottom]="GetPickerPosition() == TooltipPosition.bottom || GetPickerPosition() == TooltipPosition.bottomend"
                    [class.bs-popover-top]="GetPickerPosition() == TooltipPosition.top || GetPickerPosition() == TooltipPosition.topend"
                    [style.left.px]="posPopupLeft"
                    [style.top.px]="posPopupTop">
                    <div
                        #pickerarrow
                        class="arrow position-absolute m-0"
                        style="left: unset"
                        [style.top.px]="posArrowTop"
                        [style.left.px]="posArrowLeft">
                    </div>

                    <div class="popover-body">
                        <sac-dateselector
                            [initialvalue]="value"
                            (selectdate)="timeselect($event)"
                            timeselection="true"></sac-dateselector>
                    </div>
                </div>
            </div>
        </div>

        <div
            *ngIf="helptextmode === 'tooltip' && helptext && disablelabel"
            class="form-control-plaintext align-self-top ml-2 mr-1 w-auto"
            [ngClass]="[componentHeight | toControlHeight]">
            <sac-tooltip
                [tooltiptext]="helptext"
                [inlinemode]="true">
                <span
                    [ngClass]="HelptextTooltipIcon"
                    class="ml-1">
                </span>
            </sac-tooltip>
        </div>
    </div>
</div>
