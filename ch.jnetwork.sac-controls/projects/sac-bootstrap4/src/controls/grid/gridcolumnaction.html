<th
    #headerElement
    scope="col"
    *ngIf="IsHeader()"
    [style.width]="width"
    [class.text-right]="alignment === 'right'"
    [class.text-center]="alignment === 'center'">
    <span></span>
</th>
<td
    #bodyElement
    scope="col"
    class="px-2"
    *ngIf="IsBody()"
    [class.text-right]="alignment === 'right'"
    [class.text-center]="alignment === 'center'"
    [class.table-active]="contextstyle === 'active'"
    [class.table-primary]="contextstyle === 'primary'"
    [class.table-secondary]="contextstyle === 'secondary'"
    [class.table-light]="contextstyle === 'light'"
    [class.table-dark]="contextstyle === 'dark'"
    [class.table-success]="contextstyle === 'success'"
    [class.table-warning]="contextstyle === 'warning'"
    [class.table-danger]="contextstyle === 'danger'"
    [class.table-info]="contextstyle === 'info'">
    <ng-content></ng-content>
</td>
