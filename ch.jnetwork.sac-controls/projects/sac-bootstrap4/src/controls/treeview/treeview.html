<div
    class="row mb-3"
    [class.g-0]="disablelabel"
    [attr.data-e2e-key]="name | testingattribute: e2eidentifier">
    <label
        for="{{ name }}"
        class="col-12 col-form-label d-flex"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'sr-only', componentHeight | toLabelHeight]"
        [class.required]="isrequired">
        <div
            class="text flex-grow-0"
            [class.flex-sm-grow-1]="splitlabelandhelptext">
            {{ label }}
        </div>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [ngClass]="HelptextTooltipIcon"
                class="ml-1">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']">
        <div [class.d-flex]="helptextmode === 'tooltip' && helptext && disablelabel">
            <div
                class="w-100"
                [style.min-width]="helptextmode === 'tooltip' && helptext && disablelabel ? 0 : null"
                [class.mr-1]="helptextmode === 'tooltip' && helptext && disablelabel">
                <ul
                    class="list-group list-group-flush"
                    id="{{ name }}"
                    [class.is-invalid]="invalid && (dirty || touched)"
                    [class.border]="invalid && (dirty || touched)"
                    [class.border-danger]="invalid && (dirty || touched)">
                    <ng-container *ngFor="let node of data">
                        <ng-template
                            [ngTemplateOutlet]="treeItem"
                            [ngTemplateOutletContext]="{ node: node, deep: 0, path: '', textpath: '' }">
                        </ng-template>
                    </ng-container>
                </ul>

                <div
                    *ngIf="isinlineerrorenabled && invalid && (dirty || touched)"
                    class="invalid-feedback">
                    {{ GetErrorMessage() | async }}
                </div>

                <small
                    *ngIf="helptextmode === 'text' && helptext"
                    class="form-text text-muted">
                    {{ helptext }}
                </small>
            </div>

            <div
                *ngIf="helptextmode === 'tooltip' && helptext && disablelabel"
                class="form-control-plaintext align-self-top ml-2 mr-1 w-auto"
                [ngClass]="[componentHeight | toControlHeight]">
                <sac-tooltip
                    [tooltiptext]="helptext"
                    [inlinemode]="true">
                    <span
                        [ngClass]="HelptextTooltipIcon"
                        class="ml-1">
                    </span>
                </sac-tooltip>
            </div>
        </div>
    </div>
</div>
<ng-template
    #treeItem
    let-node="node"
    let-deep="deep"
    let-path="path"
    let-textpath="textpath">
    <li
        class="list-group-item list-group-item-action py-1 px-2 d-flex align-items-center"
        [class.active]="isSelectedState(node)"
        (mouseenter)="setHoverState(node, true)"
        (mouseleave)="setHoverState(node, false)"
        style="cursor: pointer"
        attr.data-path="{{ path }}/{{ getStringField(node, attrid) }}"
        attr.data-textpath="{{ textpath }}/{{ getStringField(node, attrlabel) }}">
        <div
            class="mx-3"
            *ngFor="let i of count(deep)">
        </div>

        <div
            (click)="onNodeClicked(node)"
            *ngIf="expandedstate === 'true' || expandedstate === true"
            class="mr-2"
            [ngClass]="!hasChildren(node) ? iconFolderEmpty : !isExpandedState(node) ? iconFolderCollabsed : isExpandedState(node) ? iconFolderOpen : ''">
        </div>

        <div
            (click)="onNodeClicked(node)"
            *ngIf="attricon && getStringField(node, attricon)">
            <ng-template
                [ngTemplateOutlet]="templateicon || defaultTemplateIcon"
                [ngTemplateOutletContext]="{ node: node }">
            </ng-template>
        </div>

        <div
            (click)="onNodeClicked(node)"
            class="flex-grow-1 py-1"
            [style.overflow]="enableellipsis ? 'hidden' : null"
            [style.text-overflow]="enableellipsis ? 'ellipsis' : null"
            [style.white-space]="enableellipsis ? 'nowrap' : null">
            <ng-template
                [ngTemplateOutlet]="templatelabel || defaultTemplateLabel"
                [ngTemplateOutletContext]="{ node: node, label: getStringField(node, attrlabel) }">
            </ng-template>
        </div>

        <div
            (click)="setSelectedState(node)"
            class="flex-shrink-0"
            *ngIf="!isDisabledState(node) && (showactionalways || isSelectedState(node) || isHoverState(node))">
            <ng-template
                [ngTemplateOutlet]="templateaction || defaultTemplateAction"
                [ngTemplateOutletContext]="{ node: node, actionhandler: onActionClicked.bind(this) }">
            </ng-template>
        </div>
    </li>

    <ng-container *ngIf="isExpandedState(node)">
        <ng-template
            *ngFor="let child of getChildren(node)"
            [ngTemplateOutlet]="treeItem"
            [ngTemplateOutletContext]="{
                node: child,
                deep: deep + 1,
                path: path + '/' + getStringField(node, attrid),
                textpath: textpath + '/' + getStringField(node, attrlabel)
            }">
        </ng-template>
    </ng-container>
</ng-template>
<ng-template
    #defaultTemplateLabel
    let-label="label"
    let-node="node">
    <span [title]="label">{{ label }}</span>
</ng-template>

<ng-template
    #defaultTemplateIcon
    let-node="node">
    <div
        class="mr-2"
        [ngClass]="getStringField(node, attricon)">
    </div>
</ng-template>

<ng-template
    #defaultTemplateAction
    let-node="node"
    let-actionhandler="actionhandler">
    <a
        class="btn btn-sm btn-link text-secondary"
        (click)="actionhandler({ action: 'default', node: node })">
        <i [class]="iconAction"></i>
    </a>
</ng-template>
