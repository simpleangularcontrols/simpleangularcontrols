<div
    id="{{ name }}"
    class="row form-group"
    [class.no-gutters]="disablelabel"
    [attr.data-e2e-key]="name | testingattribute : e2eidentifier">
    <label
        *ngIf="disablelabel === false && !isAdaptiveLabel"
        id="{{ name }}_label"
        for="{{ name }}_uploadinput"
        class="col-12 col-form-label d-flex"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'sr-only', componentHeight | toLabelHeight]"
        [class.required]="isrequired">
        <div
            class="text flex-grow-0"
            [class.flex-sm-grow-1]="splitlabelandhelptext">
            {{ label }}
        </div>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [ngClass]="HelptextTooltipIcon"
                class="ml-1">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']"
        [class.d-flex]="helptextmode === 'tooltip' && helptext && disablelabel">
        <div [class.flex-grow-1]="helptextmode === 'tooltip' && helptext && disablelabel">
            <div
                class="input-group upload-component upload-single"
                [class.input-group-sm]="componentHeight === ControlHeight.Small"
                [class.input-group-lg]="componentHeight === ControlHeight.Large"
                [class.is-invalid]="isinlineerrorenabled && invalid && (dirty || touched)">
                <div class="input-group-prepend">
                    <!-- image-preview-input -->
                    <div
                        class="btn upload-input custom-file"
                        [class.disabled]="HasQueueItem()"
                        [class.btn-secondary]="!(invalid && (dirty || touched))"
                        [class.btn-danger]="invalid && (dirty || touched)">
                        <i
                            class="pr-2"
                            [ngClass]="IconBrowse"></i>
                        <span class="upload-browse">{{ buttonbrowse ? buttonbrowse : (lngResourceService.GetString(validationKeyService.UploadButtonBrowse) | async) }}</span>
                        <input
                            type="file"
                            id="{{ name }}_uploadinput"
                            class="custom-file-input"
                            #files
                            (click)="files.value = ''"
                            (uploadxState)="onUpload($event)"
                            multiple
                            [disabled]="HasQueueItem()" />
                    </div>
                </div>
                <div
                    class="form-control upload-progress"
                    [ngClass]="[componentHeight | toControlHeight]"
                    [class.is-invalid]="invalid && (dirty || touched)">
                    <div class="progress">
                        <div
                            class="progress-bar"
                            [class.progress-bar-success]="Progress() === 100"
                            role="progressbar"
                            [attr.aria-valuenow]="Progress()"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            [style.width.%]="Progress()">
                            <span class="progress-text text-dark">{{ Filename() | async }}</span>
                        </div>
                    </div>
                </div>
                <!-- <input type="textimage-preview-filename" class="form-control image-preview-filename" disabled="disabled"> --><!-- don't give a name === doesn't send on POST/GET -->
                <div class="input-group-append">
                    <!-- image-preview-clear button -->
                    <button
                        class="btn"
                        (click)="cancelAll()"
                        [attr.disabled]="HasQueueItem() === false ? 'disabled' : null"
                        [class.disabled]="HasQueueItem() === false ? 'disabled' : null"
                        [class.btn-secondary]="!(invalid && (dirty || touched))"
                        [class.btn-danger]="invalid && (dirty || touched)">
                        <span [ngClass]="IconDelete"></span>
                    </button>
                    <button
                        *ngIf="(autoupload === false && enablepause) || (autoupload && enablepause && IsPaused() === false)"
                        class="btn"
                        (click)="pauseAll()"
                        [attr.disabled]="IsUploading() === false ? 'disabled' : null"
                        [class.disabled]="IsUploading() === false ? 'disabled' : null"
                        [class.btn-secondary]="!(invalid && (dirty || touched))"
                        [class.btn-danger]="invalid && (dirty || touched)">
                        <span [ngClass]="IconPause"></span>
                    </button>
                    <button
                        *ngIf="autoupload && enablepause && IsPaused()"
                        class="btn"
                        (click)="uploadAll()"
                        [class.btn-secondary]="!(invalid && (dirty || touched))"
                        [class.btn-danger]="invalid && (dirty || touched)">
                        <span [ngClass]="IconContinue"></span>
                    </button>
                    <button
                        *ngIf="autoupload === false"
                        class="btn text-nowrap"
                        (click)="uploadAll()"
                        [attr.disabled]="IsStateToUpload() === false ? 'disabled' : null"
                        [class.disabled]="IsStateToUpload() === false ? 'disabled' : null"
                        [class.btn-secondary]="!(invalid && (dirty || touched))"
                        [class.btn-danger]="invalid && (dirty || touched)">
                        <span
                            [ngClass]="IconUpload"
                            class="pr-2"></span
                        >{{ buttonupload ? buttonupload : (lngResourceService.GetString(validationKeyService.UploadButtonUpload) | async) }}
                    </button>
                </div>
            </div>
            <small
                *ngIf="helptextmode === 'text' && helptext"
                class="form-text text-muted">
                {{ helptext }}
            </small>
            <div
                *ngIf="isinlineerrorenabled && invalid && (dirty || touched)"
                class="invalid-feedback">
                {{ GetErrorMessage() | async }}
            </div>
        </div>

        <div
            *ngIf="helptextmode === 'tooltip' && helptext && disablelabel"
            class="form-control-plaintext align-self-top ml-2 mr-1 w-auto"
            [ngClass]="[componentHeight | toControlHeight]">
            <sac-tooltip
                [tooltiptext]="helptext"
                [inlinemode]="true">
                <span
                    [ngClass]="HelptextTooltipIcon"
                    class="ml-1">
                </span>
            </sac-tooltip>
        </div>
    </div>
</div>
