<div
    id="{{ name }}"
    class="row form-group"
    [class.no-gutters]="disablelabel"
    [attr.data-e2e-key]="name | testingattribute : e2eidentifier">
    <label
        *ngIf="disablelabel === false"
        id="{{ name }}_label"
        for="{{ name }}_uploadinput"
        class="col-12 col-form-label d-flex"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'sr-only', componentHeight | toLabelHeight]"
        [class.required]="isrequired">
        <div
            class="text flex-grow-0"
            [class.flex-sm-grow-1]="splitlabelandhelptext">
            {{ label }}
        </div>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [ngClass]="HelptextTooltipIcon"
                class="ml-1">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']">
        <div class="upload-component">
            <div class="row">
                <div class="col-12">
                    <div
                        [class.d-flex]="helptextmode === 'tooltip' && helptext && disablelabel"
                        [class.is-invalid]="isinlineerrorenabled && invalid && (dirty || touched)">
                        <div
                            class="btn-group"
                            [class.btn-group-sm]="componentHeight === ControlHeight.Small"
                            [class.btn-group-lg]="componentHeight === ControlHeight.Large">
                            <div
                                class="btn upload-input custom-file"
                                [class.disabled]="maxfiles > 0 && uploads.length >= maxfiles"
                                [class.btn-secondary]="!(invalid && (dirty || touched))"
                                [class.btn-danger]="invalid && (dirty || touched)">
                                <i
                                    [ngClass]="IconBrowse"
                                    class="pr-2"></i>
                                <span class="upload-browse">{{
                                    buttonbrowse ? buttonbrowse : (lngResourceService.GetString(validationKeyService.UploadButtonBrowse) | async)
                                }}</span>
                                <input
                                    type="file"
                                    id="{{ name }}_uploadinput"
                                    class="custom-file-input"
                                    #files
                                    (click)="files.value = ''"
                                    (uploadxState)="onUpload($event)"
                                    multiple
                                    [disabled]="maxfiles > 0 && uploads.length >= maxfiles" />
                            </div>

                            <div
                                class="btn-group"
                                [class.btn-group-sm]="componentHeight === ControlHeight.Small"
                                [class.btn-group-lg]="componentHeight === ControlHeight.Large">
                                <!-- image-preview-clear button -->
                                <button
                                    class="btn"
                                    (click)="cancelAll()"
                                    [attr.disabled]="HasQueueItem() === false ? 'disabled' : null"
                                    [class.btn-secondary]="!(invalid && (dirty || touched))"
                                    [class.btn-danger]="invalid && (dirty || touched)">
                                    <span [ngClass]="IconDelete"></span>
                                </button>
                                <button
                                    *ngIf="(autoupload === false && enablepause) || (autoupload && enablepause && IsPaused() === false)"
                                    class="btn"
                                    (click)="pauseAll()"
                                    [attr.disabled]="IsUploading() === false ? 'disabled' : null"
                                    [class.btn-secondary]="!(invalid && (dirty || touched))"
                                    [class.btn-danger]="invalid && (dirty || touched)">
                                    <span [ngClass]="IconPause"></span>
                                </button>
                                <button
                                    *ngIf="autoupload && enablepause && IsPaused() === true"
                                    class="btn"
                                    (click)="uploadAll()"
                                    [class.btn-secondary]="!(invalid && (dirty || touched))"
                                    [class.btn-danger]="invalid && (dirty || touched)">
                                    <span [ngClass]="IconContinue"></span>
                                </button>
                                <button
                                    *ngIf="autoupload === false"
                                    class="btn text-nowrap"
                                    (click)="uploadAll()"
                                    [attr.disabled]="IsStateToUpload() === false ? 'disabled' : null"
                                    [class.btn-secondary]="!(invalid && (dirty || touched))"
                                    [class.btn-danger]="invalid && (dirty || touched)">
                                    <span
                                        [ngClass]="IconUpload"
                                        class="pr-2"></span
                                    >{{ buttonupload ? buttonupload : (lngResourceService.GetString(validationKeyService.UploadButtonUpload) | async) }}
                                </button>
                            </div>
                        </div>
                        <div
                            *ngIf="helptextmode === 'tooltip' && helptext && disablelabel"
                            class="form-control-plaintext align-self-top ml-2 mr-1 w-auto"
                            [ngClass]="[componentHeight | toControlHeight]">
                            <sac-tooltip
                                [tooltiptext]="helptext"
                                [inlinemode]="true">
                                <span
                                    [ngClass]="HelptextTooltipIcon"
                                    class="ml-1">
                                </span>
                            </sac-tooltip>
                        </div>
                    </div>
                    <div
                        *ngIf="isinlineerrorenabled && invalid && (dirty || touched)"
                        class="invalid-feedback">
                        {{ GetErrorMessage() | async }}
                    </div>
                </div>
            </div>

            <div
                *ngFor="let file of uploads"
                style="margin-top: 5px">
                <div
                    class="input-group upload-component upload-multiple"
                    [class.input-group-sm]="componentHeight === ControlHeight.Small"
                    [class.input-group-lg]="componentHeight === ControlHeight.Large">
                    <div
                        class="form-control upload-progress"
                        [class.is-invalid]="invalid && (dirty || touched)">
                        <div class="progress">
                            <div
                                class="progress-bar"
                                [class.progress-bar-success]="file.progress === 100"
                                role="progressbar"
                                [attr.aria-valuenow]="file.progress"
                                aria-valuemin="0"
                                aria-valuemax="100"
                                [style.width.%]="file.progress">
                                <span class="progress-text text-dark">{{ file.name }}</span>
                            </div>
                        </div>
                    </div>
                    <div class="input-group-append">
                        <!-- image-preview-clear button -->
                        <button
                            class="btn"
                            (click)="cancel(file.uploadId)"
                            [class.btn-secondary]="!(invalid && (dirty || touched))"
                            [class.btn-danger]="invalid && (dirty || touched)">
                            <span [class]="IconDelete"></span>
                        </button>
                        <button
                            *ngIf="(autoupload === false && enablepause) || (autoupload && enablepause && file.status !== 'paused')"
                            class="btn"
                            (click)="pause(file.uploadId)"
                            [attr.disabled]="file.status !== 'uploading' ? 'disabled' : null"
                            [class.btn-secondary]="!(invalid && (dirty || touched))"
                            [class.btn-danger]="invalid && (dirty || touched)">
                            <span [class]="IconPause"></span>
                        </button>
                        <button
                            *ngIf="autoupload && enablepause && file.status === 'paused'"
                            class="btn"
                            (click)="upload(file.uploadId)"
                            [class.btn-secondary]="!(invalid && (dirty || touched))"
                            [class.btn-danger]="invalid && (dirty || touched)">
                            <span [class]="IconContinue"></span>
                        </button>
                        <button
                            *ngIf="autoupload === false"
                            class="btn text-nowrap"
                            (click)="upload(file.uploadId)"
                            [attr.disabled]="file.status !== 'added' && file.status !== 'paused' ? 'disabled' : null"
                            [class.btn-secondary]="!(invalid && (dirty || touched))"
                            [class.btn-danger]="invalid && (dirty || touched)">
                            <span
                                [ngClass]="IconUpload"
                                class="pr-2"></span
                            >{{ buttonupload ? buttonupload : (lngResourceService.GetString(validationKeyService.UploadButtonUpload) | async) }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <small
            *ngIf="helptextmode === 'text' && helptext"
            class="form-text text-muted">
            {{ helptext }}
        </small>
    </div>
</div>
