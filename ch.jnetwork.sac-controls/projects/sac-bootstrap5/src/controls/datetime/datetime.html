<div
    class="row mb-3"
    [attr.data-e2e-key]="name | testingattribute: e2eidentifier"
    [class.g-0]="disablelabel">
    <label
        *ngIf="labelMode !== 'floating'"
        for="{{ name }}"
        class="col-12 col-form-label d-flex"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'visually-hidden', componentHeight | toLabelHeight]"
        [class.required]="isrequired">
        <div
            class="text flex-grow-0"
            [class.flex-sm-grow-1]="splitlabelandhelptext">
            {{ label }}
        </div>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [ngClass]="HelptextTooltipIcon"
                class="ms-1">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-12 position-relative"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']"
        [class.d-flex]="helptextmode === 'tooltip' && helptext && (disablelabel || labelMode === 'floating')">
        <div [class.flex-grow-1]="helptextmode === 'tooltip' && helptext && (disablelabel || labelMode === 'floating')">
            <div
                class="input-group"
                [class.input-group-sm]="componentHeight === ControlHeight.Small"
                [class.input-group-lg]="componentHeight === ControlHeight.Large"
                [class.has-validation]="isinlineerrorenabled && invalid && (dirty || touched)">
                <ng-container *ngIf="labelMode === 'floating' && !disablelabel; then floatingWrapper; else inputBlock"></ng-container>

                <button
                    #pickerbutton
                    class="btn btn-secondary"
                    type="button"
                    (click)="showDateSelector()"
                    [disabled]="isdisabled">
                    <i [class]="IconSelector"></i>
                </button>
                <div
                    *ngIf="isinlineerrorenabled && invalid && (dirty || touched)"
                    class="invalid-feedback">
                    {{ GetErrorMessage() | async }}
                </div>
            </div>
            <div
                *ngIf="helptextmode === 'text' && helptext"
                class="form-text">
                {{ helptext }}
            </div>
            <div
                #picker
                *ngIf="_showselector">
                <div
                    class="popover fade show position-absolute bs-popover-auto"
                    role="tooltip"
                    [attr.data-popper-placement]="
                        GetPickerPosition() === TooltipPosition.right
                            ? 'right'
                            : GetPickerPosition() === TooltipPosition.left
                              ? 'left'
                              : GetPickerPosition() === TooltipPosition.top || GetPickerPosition() === TooltipPosition.topend
                                ? 'top'
                                : GetPickerPosition() === TooltipPosition.bottom || GetPickerPosition() === TooltipPosition.bottomend
                                  ? 'bottom'
                                  : null
                    "
                    [style.left.px]="posPopupLeft"
                    [style.top.px]="posPopupTop">
                    <div
                        #pickerarrow
                        class="popover-arrow position-absolute"
                        style="left: unset"
                        [style.top.px]="posArrowTop"
                        [style.left.px]="posArrowLeft">
                    </div>

                    <div class="popover-body">
                        <sac-dateselector
                            name="{{ name }}_picker"
                            [initialvalue]="value"
                            (selectdate)="dateselect($event)"
                            dateselection="true"
                            timeselection="true"></sac-dateselector>
                    </div>
                </div>
            </div>
        </div>

        <div
            *ngIf="helptextmode === 'tooltip' && helptext && (disablelabel || labelMode === 'floating')"
            class="form-control-plaintext align-self-top ms-2 me-1 w-auto"
            [ngClass]="[componentHeight | toControlHeight]">
            <sac-tooltip
                [tooltiptext]="helptext"
                [inlinemode]="true">
                <span
                    [ngClass]="HelptextTooltipIcon"
                    class="ml-1">
                </span>
            </sac-tooltip>
        </div>
    </div>
</div>

<ng-template #floatingWrapper>
    <div
        *ngIf="labelMode === 'floating'"
        class="form-floating">
        <ng-container *ngTemplateOutlet="inputBlock"></ng-container>
    </div>
</ng-template>

<ng-template #inputBlock>
    <input
        id="{{ name }}"
        name="{{ name }}"
        type="text"
        class="form-control"
        [imask]="imaskDate"
        [attr.placeholder]="placeholder"
        [value]="valuestring"
        [class.is-invalid]="invalid && (dirty || touched)"
        [ngClass]="[componentHeight | toControlHeight]"
        (blur)="onTouch()"
        (accept)="setValueString($event)"
        [disabled]="isdisabled" />

    <label
        *ngIf="labelMode === 'floating' && !disablelabel"
        for="{{ name }}"
        [class.required]="isrequired">
        <div
            class="text flex-grow-0"
            [class.flex-sm-grow-1]="splitlabelandhelptext">
            {{ label }}
        </div>
    </label>
</ng-template>
