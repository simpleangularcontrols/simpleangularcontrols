<th
    #headerElement
    scope="col"
    *ngIf="IsHeader()"
    [style.width]="width"
    (click)="SortByColumn()"
    [class.text-right]="alignment === 'right'"
    [class.text-center]="alignment === 'center'">
    <span>{{ header }}</span>
    <span
        class="ps-2"
        [class]="IconSortUp"
        *ngIf="IsSortedColumn() && GetSortDirection() === 'asc'"></span>
    <span
        class="ps-2"
        [class]="IconSortDown"
        *ngIf="IsSortedColumn() && GetSortDirection() === 'desc'"></span>
</th>
<td
    #bodyElement
    scope="col"
    *ngIf="IsBody()"
    [style.width]="width"
    [class.ellipsis]="IsEllipsis()"
    (click)="ColumnClick()"
    [style.max-width]="IsEllipsis() ? width : null"
    [style.overflow]="IsEllipsis() ? 'hidden' : null"
    [style.text-overflow]="IsEllipsis() ? 'ellipsis' : null"
    [style.white-space]="IsEllipsis() ? 'nowrap' : null"
    [class.text-right]="alignment === 'right'"
    [class.text-center]="alignment === 'center'"
    [class.table-primary]="contextstyle === 'active' || contextstyle === 'primary'"
    [class.table-secondary]="contextstyle === 'secondary'"
    [class.table-light]="contextstyle === 'light'"
    [class.table-dark]="contextstyle === 'dark'"
    [class.table-success]="contextstyle === 'success'"
    [class.table-warning]="contextstyle === 'warning'"
    [class.table-danger]="contextstyle === 'danger'"
    [class.table-info]="contextstyle === 'info'">
    <span
        [attr.title]="IsEllipsis() ? value : null"
        [innerHtml]="value">
    </span>
</td>
