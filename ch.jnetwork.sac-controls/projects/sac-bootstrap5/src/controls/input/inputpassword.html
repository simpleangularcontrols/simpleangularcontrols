<div
    class="row mb-3"
    [class.g-0]="disablelabel"
    [attr.data-e2e-key]="name | testingattribute : e2eidentifier">
    <label
        for="{{ name }}"
        class="col-12 col-form-label d-flex"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'visually-hidden', componentHeight | toLabelHeight]"
        [class.required]="isrequired">
        <div
            class="text flex-grow-0"
            [class.flex-sm-grow-1]="splitlabelandhelptext">
            {{ label }}
        </div>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [ngClass]="HelptextTooltipIcon"
                class="ms-1">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']"
        [class.d-flex]="helptextmode === 'tooltip' && helptext && disablelabel">
        <div [class.flex-grow-1]="helptextmode === 'tooltip' && helptext && disablelabel">
            <div
                [class.input-group]="passwordeye"
                [class.has-validation]="passwordeye && isinlineerrorenabled && invalid && (dirty || touched)">
                <input
                    id="{{ name }}"
                    name="{{ name }}"
                    [type]="passwordeyevisible ? 'text' : 'password'"
                    class="form-control"
                    [attr.placeholder]="placeholder"
                    [value]="value"
                    (blur)="onTouch()"
                    (input)="setValue($event.target.value)"
                    [attr.maxlength]="maxtextlength"
                    autocomplete="new-password"
                    [class.is-invalid]="invalid && (dirty || touched)"
                    [ngClass]="[componentHeight | toControlHeight]"
                    [disabled]="isdisabled"
                    [readonly]="readonly" />
                <a
                    *ngIf="passwordeye"
                    class="btn btn-outline-secondary"
                    (click)="onTogglePasswordEye()"
                    ><span [ngClass]="passwordeyevisible ? PasswordEyeVisibleIcon : PasswordEyeHiddenIcon"></span>
                </a>
                <div
                    *ngIf="isinlineerrorenabled && invalid && (dirty || touched)"
                    class="invalid-feedback">
                    {{ GetErrorMessage() | async }}
                </div>
            </div>
            <div
                *ngIf="helptextmode === 'text' && helptext"
                class="form-text">
                {{ helptext }}
            </div>
        </div>

        <div
            *ngIf="helptextmode === 'tooltip' && helptext && disablelabel"
            class="form-control-plaintext align-self-top ms-2 me-1 w-auto"
            [ngClass]="[componentHeight | toControlHeight]">
            <sac-tooltip
                [tooltiptext]="helptext"
                [inlinemode]="true">
                <span
                    [ngClass]="HelptextTooltipIcon"
                    class="ml-1">
                </span>
            </sac-tooltip>
        </div>
    </div>
</div>
