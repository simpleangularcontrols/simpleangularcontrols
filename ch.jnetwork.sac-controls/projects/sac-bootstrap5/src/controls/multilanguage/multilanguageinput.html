<div
    [attr.data-e2e-key]="name | testingattribute: e2eidentifier"
    class="row mb-3"
    [class.g-0]="disablelabel">
    <label
        *ngIf="labelMode !== 'floating'"
        for="{{ name }}"
        class="col-12 col-form-label d-flex"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toLabelWidthCss) : 'visually-hidden', componentHeight | toLabelHeight]"
        [class.required]="isrequired">
        <div
            class="text flex-grow-0"
            [class.flex-sm-grow-1]="splitlabelandhelptext">
            {{ label }}
        </div>
        <sac-tooltip
            *ngIf="helptextmode === 'tooltip' && helptext"
            [tooltiptext]="helptext"
            [inlinemode]="true">
            <span
                [ngClass]="HelptextTooltipIcon"
                class="ms-1">
            </span>
        </sac-tooltip>
    </label>
    <div
        class="col-12"
        [ngClass]="[disablelabel === false ? (this.labelSizes | toControlWidthCss) : '']"
        [class.d-flex]="helptextmode === 'tooltip' && helptext && (disablelabel || labelMode === 'floating')">
        <div [class.flex-grow-1]="helptextmode === 'tooltip' && helptext && (disablelabel || labelMode === 'floating')">
            <div
                class="input-group"
                [class.input-group-sm]="componentHeight === ControlHeight.Small"
                [class.input-group-lg]="componentHeight === ControlHeight.Large"
                [class.has-validation]="isinlineerrorenabled && invalid && (dirty || touched)"
                placement="bottom-right"
                sac-multilanguagemenu
                [buttontemplate]="menuButton"
                [inputtemplate]="menuInput"
                [validationtemplate]="validationMessage"
                #contextmenu>
                <ng-template #menuInput>
                    <ng-container *ngIf="labelMode === 'floating' && !disablelabel; then floatingWrapper; else inputBlock"></ng-container>
                </ng-template>

                <ng-template #menuButton>
                    <button
                        sacMultilanguageMenuAnchor
                        [id]="name + '_dropdownitem'"
                        type="button"
                        class="btn dropdown-toggle"
                        (click)="contextmenu.toggle()"
                        [ngClass]="[IsAnyEmpty() ? 'btn-warning' : 'btn-secondary']">
                        <img
                            src="{{ SelectedIcon }}"
                            class="align-baseline mr-1 ml-1"
                            *ngIf="SelectedIconType === IconType.Image" />
                        <span
                            [ngClass]="SelectedIcon"
                            class="align-baseline mr-1 ml-1"
                            *ngIf="SelectedIconType === IconType.CssSprite"></span>
                    </button>
                </ng-template>

                <ng-template #validationMessage>
                    <div
                        *ngIf="isinlineerrorenabled && invalid && (dirty || touched)"
                        class="invalid-feedback">
                        {{ GetErrorMessage() | async }}
                    </div></ng-template
                >

                <ng-container *ngFor="let sprache of Languages">
                    <sac-multilanguagemenubutton
                        *ngIf="sprache.IconType === IconType.Image"
                        text="{{ sprache.Text }}"
                        image="{{ sprache.Icon }}"
                        [cssclass]="IsEmpty(sprache) ? 'text-danger border-left border-danger' : ''"
                        (clicked)="SelectLanguage(sprache)"></sac-multilanguagemenubutton>
                    <sac-multilanguagemenubutton
                        *ngIf="sprache.IconType === IconType.CssSprite"
                        text="{{ sprache.Text }}"
                        icon="{{ sprache.Icon }}"
                        [cssclass]="IsEmpty(sprache) ? 'text-danger border-left border-danger' : ''"
                        (clicked)="SelectLanguage(sprache)"></sac-multilanguagemenubutton>
                    <sac-multilanguagemenubutton
                        *ngIf="!sprache.IconType"
                        text="{{ sprache.Text }}"
                        image="{{ sprache.Icon }}"
                        [cssclass]="IsEmpty(sprache) ? 'text-danger border-left border-danger' : ''"
                        (clicked)="SelectLanguage(sprache)"></sac-multilanguagemenubutton>
                </ng-container>
            </div>
            <div
                *ngIf="helptextmode === 'text' && helptext"
                class="form-text">
                {{ helptext }}
            </div>
        </div>

        <div
            *ngIf="helptextmode === 'tooltip' && helptext && (disablelabel || labelMode === 'floating')"
            class="form-control-plaintext align-self-center ms-2 me-1 w-auto"
            [ngClass]="[componentHeight | toControlHeight]">
            <sac-tooltip
                [tooltiptext]="helptext"
                [inlinemode]="true">
                <span
                    [ngClass]="HelptextTooltipIcon"
                    class="ml-1">
                </span>
            </sac-tooltip>
        </div>
    </div>
</div>

<ng-template #floatingWrapper>
    <div
        *ngIf="labelMode === 'floating'"
        class="form-floating">
        <ng-container *ngTemplateOutlet="inputBlock"></ng-container>
    </div>
</ng-template>

<ng-template #inputBlock>
    <input
        id="{{ name }}"
        name="{{ name }}"
        type="text"
        class="form-control"
        [value]="LanguageValue"
        [attr.placeholder]="placeholder || (labelMode === 'floating' && !disablelabel ? label : null)"
        (blur)="onTouch()"
        (input)="SetLanguageValue($event.target.value)"
        [attr.maxlength]="maxtextlength"
        [class.is-invalid]="invalid && (dirty || touched)"
        [ngClass]="[componentHeight | toControlHeight]"
        [disabled]="isdisabled" />

    <label
        *ngIf="labelMode === 'floating' && !disablelabel"
        for="{{ name }}"
        [class.required]="isrequired">
        <div
            class="text flex-grow-0"
            [class.flex-sm-grow-1]="splitlabelandhelptext"
            >{{ label }}</div
        >
    </label>
</ng-template>
